slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    base_frame: base_link
    map_frame: map
    scan_topic: /scan
    mode: mapping
    resolution: 0.03

    minimum_travel_distance: 0.1     # default 0.5 (m)
    minimum_travel_heading: 0.2     # default 0.5 (rad, ~28 deg)
    use_scan_matching: true
    use_scan_barycenter: true
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    max_laser_range: 12.0       # match your sim lidar
    minimum_time_interval: 0.5
    map_update_interval: 2.0
    do_loop_closing: true