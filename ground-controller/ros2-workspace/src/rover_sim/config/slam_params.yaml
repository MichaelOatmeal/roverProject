slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    base_frame: base_link
    map_frame: map
    scan_topic: /scan
    mode: mapping
    resolution: 0.015
    max_laser_range: 12.0       # match your sim lidar
    minimum_time_interval: 0.5
    map_update_interval: 2.0
    do_loop_closing: true